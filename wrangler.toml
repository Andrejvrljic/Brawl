name = "kistenkrawall"
main = "cloudflare/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Das Spiel selbst (HTML, JavaScript, 3D-Engine)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Ein gemeinsamer Spielserver für alle Räume (Echtzeit über WebSocket)
[[durable_objects.bindings]]
name = "ARENA"
class_name = "ArenaDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArenaDO"]

# Konten, Fortschritt, Rangliste. database_id setzt der GitHub-Actions-Workflow ein.
[[d1_databases]]
binding = "DB"
database_name = "kistenkrawall-db"
database_id = "__D1_DATABASE_ID__"
