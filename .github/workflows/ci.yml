# Testet Spiellogik, Belohnungen, Datenbank und Server bei jedem Push und Pull Request
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Server-Start prüfen
        run: |
          DB_PATH=/tmp/ci.db PORT=3000 npm start &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3000/api/health && exit 0; sleep 0.5; done
          echo "Server ist nicht gestartet" && exit 1
